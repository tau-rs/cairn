# cargo-audit configuration. See https://github.com/rustsec/rustsec/tree/main/cargo-audit
#
# The scheduled CVE scanner (.github/workflows/security-daily.yml) runs
# `cargo audit` against the committed lockfile and files a GitHub issue for any
# advisory it has not seen before. Record accepted advisories here so they are
# not re-surfaced (and so the acceptance rationale lives in-repo, not only in a
# closed issue). cargo-deny keeps its own advisory `ignore` list in deny.toml;
# only advisories that cargo-deny actually denies belong there.

[advisories]
ignore = [
    # RUSTSEC-2026-0253 — `lru` 0.16.4 `LruCache::pop()` is not panic-safe: a
    # use-after-free is possible only if a stored cache KEY has a panicking
    # `Drop` and is used under `catch_unwind`. `lru` reaches cairn purely
    # transitively via `tantivy` 0.26.1 (`lru ^0.16.3`); no cairn crate depends
    # on or calls `lru` directly, and tantivy keys its internal caches with
    # plain ids that have no panicking `Drop`, so the precondition is
    # unreachable from cairn. No patched `lru` is published within tantivy's
    # semver range and tantivy 0.26.1 is already the latest release, so there is
    # no upgrade path today. Re-evaluate when tantivy bumps its `lru` req.
    "RUSTSEC-2026-0253",

    # RUSTSEC-2024-0436 — `paste` 1.0.15 is unmaintained (no CVE). It is a
    # BUILD-TIME proc-macro that emits no runtime code, pulled purely
    # transitively behind cairn-infra's optional `neural` feature via
    # candle-core 0.9.2 -> gemm/pulp (and tokenizers). 1.0.15 is its final
    # release, so there is no version to move to, and dropping it requires the
    # upstream ML stack to migrate off `paste`; candle is pinned at 0.9.2 (0.11
    # breaks aarch64 builds, held via #153). cargo-deny already excludes this
    # via its `unmaintained = "workspace"` scope. Re-evaluate when candle/gemm
    # drop their `paste` dependency.
    "RUSTSEC-2024-0436",
]
