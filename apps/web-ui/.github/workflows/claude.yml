name: Claude

# Anthropic Claude Code action — `@claude` mention bot.
#
# Triggers when "@claude" appears in an issue, a comment, a PR review
# comment, or a PR review submission. Claude reads the surrounding
# context, answers, and (with the permissions below) can push commits
# to an open PR branch.
#
# Security
# --------
# - Actor allowlist enforced in the `if:` gate — only the configured
#   GitHub users can trigger a run. Prevents arbitrary commenters on
#   public issues/PRs from driving the bot.
# - The gate also requires the literal `@claude` mention in the
#   triggering content, so it does not run on every comment.
# - `pull_request_target` / `workflow_run` are intentionally NOT used
#   (they would expose secrets to fork PRs).
#
# Secret (required before this works)
# -----------------------------------
# Add `CLAUDE_CODE_OAUTH_TOKEN` under repo Settings → Secrets and
# variables → Actions. Generate it locally with `claude setup-token`
# (Claude Code CLI); it bills against your Claude.ai subscription and
# starts with `sk-ant-oat01-`. The Claude GitHub App must also be
# installed on this repository.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Allowlist actors. Add additional logins as more contributors
    # need the bot.
    if: |
      contains(fromJSON('["LEBOCQTitouan"]'), github.actor) && (
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') ||
           contains(github.event.issue.title, '@claude')))
      )

    runs-on: ubuntu-latest

    # Least-privilege for claude-code-action:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      # v1 of the action: `model` moved into `claude_args` (--model). Model
      # stays pinned explicitly: the action's built-in default has been
      # retired before (claude-sonnet-4-20250514 404'd) — a pinned, current
      # model fails loudly at bump time instead of silently at retirement
      # time. Sonnet 5 is the current Sonnet.
      - name: Claude mention bot
        id: claude
        continue-on-error: true # failures are classified in the next step
        uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1.0.189
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5

      # The OAuth token bills against a Claude subscription; when its usage
      # cap is exhausted the action fails in <1s with "Spending cap reached"
      # until the cap resets. That's a quota condition, not a bot defect —
      # swallow it (green check + notice). Anything else is a real failure.
      - name: Classify bot outcome
        if: steps.claude.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          result=""
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            result=$(jq -r '[.[] | select(.type == "result")] | last | .result // empty' \
              "$EXECUTION_FILE" 2>/dev/null || true)
          fi
          echo "Claude result message: ${result:-<none>}"
          if printf '%s' "$result" | grep -qiE 'spending cap|usage limit|credit balance|rate limit'; then
            echo "::notice::@claude run skipped: Claude usage cap reached (\"$result\"). It will resume once the cap resets."
            exit 0
          fi
          echo "::error::Claude mention bot failed for a non-quota reason — see the 'Claude mention bot' step logs."
          exit 1
