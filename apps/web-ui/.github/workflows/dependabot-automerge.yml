name: Dependabot auto-merge

# Enables GitHub auto-merge ("merge when ready" → merge queue) for the
# low-risk class of Dependabot PRs only: DEVELOPMENT dependencies bumped by
# a MINOR or PATCH. Everything else — production deps, any major, and all
# cargo (Rust shell) bumps — is left for manual review, matching the policy
# in dependabot.yml. Auto-merge still requires the full CI gate + AI review
# to pass; this only flips the "merge when green" switch so the merge queue
# drains them without a human clicking the button.

on: pull_request

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    name: enable auto-merge (dev minor/patch)
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for dev-dependency minor/patch
        if: >-
          steps.meta.outputs.dependency-type == 'direct:development' &&
          (steps.meta.outputs.update-type == 'version-update:semver-minor' ||
           steps.meta.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge --auto "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
