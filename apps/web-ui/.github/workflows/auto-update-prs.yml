name: Auto-update PR branches

# When a commit lands on main, walks every open non-draft PR and
# calls "Update branch" on any that are BEHIND base. GitHub's
# update-branch operation merges main into the PR branch via a
# merge commit; on a clean merge it succeeds (and triggers one
# fresh CI run on the updated PR). On conflict it returns an error
# which this workflow swallows — manual resolution is required.
#
# Why this exists
# ---------------
# Bots (Dependabot) + human + Claude sessions routinely push to main
# while PRs are open. Branch protection is strict, so every PR that
# falls behind needs updating before it can merge. This removes that
# manual friction, and is the workflow the protect-main concurrency
# policy in ci.yml was built to pair with.
#
# Triggers
# --------
# - push to main: the moment main advances, update everyone.
# - workflow_dispatch: manual catch-up.
# - schedule (every 30 min): catch-net if a push trigger didn't fire.
#
# Skips: draft PRs, closed PRs, DIRTY (conflict) PRs, and fork PRs
# (GITHUB_TOKEN can't push to a fork branch — the error is swallowed).
#
# Security: only reads PR metadata and triggers GitHub's own
# "Update branch" API. PR numbers are integers from the API (no
# injection surface); repo name comes from github.repository.

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: auto-update-prs
  cancel-in-progress: true

permissions:
  # `contents: write`, not read: GitHub's "Update branch" operation
  # (updatePullRequestBranch) merges base into the PR branch, which is a
  # *write* to repository contents. With `contents: read` every call fails
  # with "github-actions[bot] does not have permission to update this pull
  # request" — and this workflow swallows update failures, so it reported
  # success while updating nothing. Observed 2026-08-27 on #161 and #165.
  contents: write
  pull-requests: write

jobs:
  update:
    name: update behind PRs
    runs-on: ubuntu-latest
    steps:
      - name: Update each behind PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          # Via env, not inline `${{ }}` in run: — same convention as REPO.
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # mergeStateStatus is computed asynchronously by GitHub after
          # a push lands. Wait briefly so it is accurate.
          if [[ "$EVENT" == "push" ]]; then
            sleep 45
          fi

          # Do NOT filter on mergeStateStatus == "BEHIND". With a merge queue
          # enabled GitHub reports a behind-but-otherwise-mergeable PR as
          # CLEAN, because the queue is nominally responsible for updating it
          # at merge time. Branch protection here is `strict`, so such a PR
          # still cannot merge — and this workflow, keying on BEHIND, logged
          # "No behind PRs to update" and did nothing. Five Dependabot PRs sat
          # with auto-merge armed and green CI for three days (2026-08-24 →
          # 2026-08-27) before anyone noticed.
          #
          # Ask git instead of the merge-state heuristic: compare/base...head
          # reports `behind_by` regardless of queue configuration.
          mapfile -t candidates < <(
            gh pr list --repo "$REPO" --state open --limit 100 \
              --json number,isDraft,headRefName,isCrossRepository \
              --jq '.[] | select(.isDraft == false and .isCrossRepository == false)
                    | "\(.number) \(.headRefName)"'
          )

          prs=()
          for entry in "${candidates[@]}"; do
            num="${entry%% *}"
            head="${entry#* }"
            behind=$(gh api "repos/$REPO/compare/$BASE...$head" \
              --jq '.behind_by' 2>/dev/null || echo 0)
            if [[ "${behind:-0}" -gt 0 ]]; then
              echo "PR #$num is $behind commit(s) behind $BASE."
              prs+=("$num")
            fi
          done

          if [[ ${#prs[@]} -eq 0 ]]; then
            echo "No behind PRs to update."
            exit 0
          fi

          echo "Will attempt to update ${#prs[@]} PR(s): ${prs[*]}"
          updated=0
          skipped=0
          for pr in "${prs[@]}"; do
            echo "::group::PR #$pr"
            if out=$(gh pr update-branch "$pr" --repo "$REPO" 2>&1); then
              echo "$out"
              updated=$((updated + 1))
              echo "Updated."

              # Updating the branch is not enough. GitHub does NOT re-evaluate
              # an already-armed auto-merge when the head changes: once a PR has
              # been ineligible (behind base), bringing it back to CLEAN does
              # not re-fire auto-merge, so it never enters the merge queue.
              # Observed on #163 — CLEAN + auto-merge ON + free queue capacity,
              # and it only enqueued after toggling auto-merge off and on.
              #
              # Only re-arm where auto-merge was ALREADY on. Arming it here
              # unconditionally would bypass the deliberate human gate on
              # production-dependency PRs (dependabot-automerge.yml arms only
              # dev-dependency minor/patch bumps).
              if [[ "$(gh pr view "$pr" --repo "$REPO" \
                        --json autoMergeRequest \
                        --jq '.autoMergeRequest != null')" == "true" ]]; then
                if gh pr merge "$pr" --repo "$REPO" --disable-auto >/dev/null 2>&1 &&
                   gh pr merge "$pr" --repo "$REPO" --auto >/dev/null 2>&1; then
                  echo "Re-armed auto-merge."
                else
                  echo "::warning::PR #$pr updated but auto-merge could not be re-armed; it may stall."
                fi
              fi
            else
              skipped=$((skipped + 1))
              echo "$out"
              # Distinguish an expected skip from a misconfiguration. A
              # conflict is normal (Dependabot siblings racing on the same
              # lockfile) and is resolved by a rebase. A permission failure is
              # a workflow bug that silently disables this entire job — it
              # must not read as routine. Lumping both under one "Skipped"
              # line is how a broken `contents: read` went unnoticed.
              case "$out" in
                *"does not have permission"*|*"Resource not accessible"*)
                  echo "::error::PR #$pr: no permission to update branch. This job needs 'contents: write'; every update is failing." ;;
                *conflict*|*Conflict*)
                  echo "Skipped: merge conflict — needs a rebase (for Dependabot: '@dependabot rebase')." ;;
                *)
                  echo "::warning::PR #$pr: update-branch failed for an unrecognized reason (see above)." ;;
              esac
            fi
            echo "::endgroup::"
          done

          echo ""
          echo "Done. updated=$updated skipped=$skipped"
