name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

# Cancel superseded runs on the same ref EXCEPT on main, where the
# rust-cache save-step runs (see .github/actions/setup-rust). Cancelling
# a main run mid-cache-write means the cache write never completes and
# subsequent PRs restore from a stale cache.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Fresh CI runs; rust-cache provides between-run caching, so disable
  # cargo's within-run incremental compilation for determinism.
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          shared-key: linux
          with-just: true
      - run: just fmt

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          shared-key: linux
          with-sccache: true
          with-mold: true
          with-just: true
      - run: just lint

  neural:
    name: neural feature
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          shared-key: linux
          with-sccache: true
          with-mold: true
      - run: cargo clippy -p cairn-infra -p cairn-startup --features neural --locked --all-targets
      - run: cargo test -p cairn-infra --features neural --locked

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # advisories + licenses + bans + sources per deny.toml at repo root.
          arguments: --all-features

  test:
    name: test / ${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'macos-latest' && 'macos' || 'windows' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: ${{ matrix.os }}
          with-nextest: true
          with-sccache: true
          with-mold: true
          with-just: true
      - name: Install bubblewrap (Linux sandbox backend)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: just test

  doc-tests:
    name: doc-tests / linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux
          with-sccache: true
          with-mold: true
          with-just: true
      # nextest does not run doctests; cover them here (Linux is enough —
      # no OS-specific doc examples in this workspace).
      - run: just doc-test

  locked-check:
    # Guards the Cargo.lock MSRV pin: a `cargo update` / Dependabot bump
    # that pulls a crate raising MSRV above the pinned Rust 1.88 fails
    # here loudly instead of silently. rust-toolchain.toml pins 1.88, so
    # this is also the MSRV build check.
    name: locked-check (MSRV 1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          with-mold: true
          shared-key: linux
          with-just: true
      - run: just locked-check

  bindings-current:
    # apps/web-ui compiles against the committed ts-rs bindings (no vendored
    # copy, monorepo spec D5). Regenerate them and fail on any diff so a Rust
    # contract change can never ship without its TypeScript twin.
    name: bindings-current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux
          with-sccache: true
          with-mold: true
          with-just: true
      - run: just bindings-check

  changes:
    # Which UI stacks does this run touch? Engine jobs above always run; the
    # web / e2e / tauri jobs below gate on these outputs so a Rust-only PR
    # never pays for pnpm or a Tauri build (and vice versa).
    #   pull_request: dorny/paths-filter against the PR base.
    #   merge_group:  paths-filter has no reliable base there
    #                 (dorny/paths-filter#280), so changed-stacks.sh diffs
    #                 base_sha..head_sha with the SAME path lists — keep the
    #                 two lists in step.
    #   push (main):  everything on.
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.decide.outputs.web }}
      tauri: ${{ steps.decide.outputs.tauri }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            web:
              - 'apps/web-ui/web/**'
              - 'apps/web-ui/justfile'
              - 'crates/cairn-contract/bindings/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/changed-stacks.sh'
            tauri:
              - 'apps/web-ui/src-tauri/**'
              - 'apps/web-ui/justfile'
              - 'apps/web-ui/deny.toml'
              - 'crates/**'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - '.github/scripts/changed-stacks.sh'
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          PR_WEB: ${{ steps.filter.outputs.web }}
          PR_TAURI: ${{ steps.filter.outputs.tauri }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          case "$EVENT" in
            pull_request)
              { echo "web=$PR_WEB"; echo "tauri=$PR_TAURI"; } >> "$GITHUB_OUTPUT" ;;
            merge_group)
              out=$(bash .github/scripts/changed-stacks.sh "$MQ_BASE" "$MQ_HEAD")
              echo "$out"; echo "$out" >> "$GITHUB_OUTPUT" ;;
            *)
              { echo "web=true"; echo "tauri=true"; } >> "$GITHUB_OUTPUT" ;;
          esac

  web:
    # apps/web-ui web gate: `just web-ci` (eslint, prettier --check, tsc,
    # vitest, vite build) + `just web-deny` (pnpm audit, high+). Recipes live
    # in apps/web-ui/justfile so local == CI for the UI stack too.
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: just
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.14.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web-ui/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web-ui/web
      - run: just -f apps/web-ui/justfile web-ci
      - run: just -f apps/web-ui/justfile web-deny

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web-ui/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.14.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web-ui/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web-ui/web/playwright-report/
            apps/web-ui/web/test-results/
          retention-days: 7

  tauri:
    # apps/web-ui desktop shell: its own Cargo workspace (excluded from the
    # engine's, spec D3) depending on crates/ by path. `just rust-ci` = fmt
    # --check, clippy -D warnings, test --locked, build --locked.
    name: tauri
    needs: changes
    if: needs.changes.outputs.tauri == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Build into the root target/ so setup-rust's rust-cache (keyed by
      # shared-key) covers the Tauri tree too.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install WebKitGTK + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential cmake
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          shared-key: tauri
          with-just: true
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-deny
      - run: just -f apps/web-ui/justfile rust-ci
      - run: just -f apps/web-ui/justfile rust-deny

  ci-summary:
    # Single aggregated status for branch protection: require this one
    # check. It is green only when every real job succeeded (or skipped).
    name: ci-summary
    if: always()
    needs: [fmt, clippy, cargo-deny, test, doc-tests, locked-check, neural, bindings-current, changes, web, e2e, tauri]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all jobs to have succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required CI job did not succeed ($r)"; exit 1 ;;
            esac
          done
