name: coverage

# Measurement, not gating. Coverage is a signal to inform refactors and
# spot zero-coverage modules; never a hard threshold (a hard gate
# incentivizes test-for-coverage-not-correctness).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  coverage:
    name: cargo llvm-cov nextest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
          shared-key: linux
          with-nextest: true
          with-sccache: true
          with-mold: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-llvm-cov
      - name: Generate lcov coverage
        run: |
          cargo llvm-cov nextest \
            --workspace --no-fail-fast \
            --lcov --output-path lcov.info \
            --ignore-filename-regex '(tests/|/target/|/build\.rs$)'
      - name: Summarise coverage
        run: |
          covered=$(grep -h '^DA:' lcov.info | awk -F, '$2!="0"{c++} END{print c+0}')
          total=$(grep -h '^DA:' lcov.info | wc -l)
          if [ "$total" -gt 0 ]; then
            pct=$(awk "BEGIN{printf \"%.1f\", ($covered/$total)*100}")
          else
            pct="0.0"
          fi
          {
            echo "## Coverage baseline"
            echo
            echo "- **Line coverage:** ${pct}% (${covered} / ${total})"
            echo "- LCOV artifact attached to this run."
            echo
            echo "Coverage is a signal, not a gate."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lcov artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-${{ github.sha }}
          path: lcov.info
          retention-days: 14

  vitest-coverage:
    # apps/web-ui web stack. Same policy: a signal, never a gate.
    name: vitest coverage (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web-ui/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.14.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web-ui/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run vitest with coverage
        run: pnpm test:coverage
      - name: Summarise coverage
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            pct=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
            {
              echo "## Coverage baseline (web)"
              echo
              echo "- **Line coverage:** ${pct}%"
              echo "- LCOV artifact attached to this run."
              echo
              echo "Coverage is a signal, not a gate."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage-summary.json produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload lcov artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-web-${{ github.sha }}
          path: apps/web-ui/web/coverage/lcov.info
          retention-days: 14
