[package]
name = "cairn-infra"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cairn-domain = { path = "../cairn-domain" }
cairn-ports = { path = "../cairn-ports" }
cairn-plugin-protocol = { path = "../cairn-plugin-protocol" }
git2 = { workspace = true }
notify = { workspace = true }
tantivy = { workspace = true }
notify-debouncer-full = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "0.20", optional = true, default-features = false, features = ["onig"] }
dirs = { version = "6", optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
neural = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:dirs"]

[lints]
workspace = true
